<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Odoo Reset Hub</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>Odoo Reset Hub</h1>
        <span id="status" class="status checking" title="Helper status"></span>
    </header>

    <div id="setupNotice" class="notice error" hidden>
        <strong>One-time setup needed</strong>
        Double-click <code>install.bat</code> in the project folder, then reopen this popup.
    </div>

    <form id="form" autocomplete="off">
        <label for="db">Database</label>
        <div class="combo">
            <input id="db" placeholder="Type or pick a database" required spellcheck="false"
                   role="combobox" aria-expanded="false" aria-controls="dbList">
            <span class="caret" aria-hidden="true"></span>
            <ul id="dbList" class="dropdown" role="listbox" hidden></ul>
        </div>
        <div id="dbMeta" class="meta"></div>

        <div class="row">
            <div>
                <label for="login">Login</label>
                <input id="login" value="admin" required spellcheck="false">
            </div>
            <div>
                <label for="password">New password</label>
                <input id="password" value="admin" required spellcheck="false">
            </div>
        </div>

        <label class="check">
            <input type="checkbox" id="autoLogin" checked>
            <span>Log in on the current tab after reset</span>
        </label>

        <details>
            <summary>Advanced</summary>
            <div class="row">
                <div>
                    <label for="version">Odoo version</label>
                    <select id="version">
                        <option value="auto">Auto-detect</option>
                        <option value="16">16 (openpg16)</option>
                        <option value="17">17 (openpg17)</option>
                        <option value="18">18 (openpg)</option>
                        <option value="19">19 (openpg)</option>
                    </select>
                </div>
                <div>
                    <label for="userId">Odoo user ID</label>
                    <input id="userId" type="number" value="2" min="1">
                </div>
            </div>
            <label for="dbUser">PostgreSQL user override</label>
            <input id="dbUser" placeholder="leave empty for auto" spellcheck="false">
        </details>

        <button id="submit" type="submit">Reset password</button>
    </form>

    <div id="msg" class="notice" hidden></div>

    <script src="popup.js"></script>
</body>
</html>
